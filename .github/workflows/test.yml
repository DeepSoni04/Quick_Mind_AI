name: CI Test & Build Suite

on:
  push:
    branches: [ main, development, development_branch ]
  pull_request:
    branches: [ main, development, development_branch ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          ENVIRONMENT: development
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: querymind_test
          LLM_PROVIDER: mock
          JWT_SECRET_KEY: test_secret_key_for_ci_pipeline_32bytes_min
          ENCRYPTION_KEY: v8F5N9zT0yJ_3W2_3Z9a8K0L1M2N3O4P5Q6R7S8T9U0=
        run: |
          cd backend
          pytest -v

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm run build
